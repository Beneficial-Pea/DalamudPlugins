name: Build and publish LogMimic (experimental)

on:
  push:
    branches: [main]
    paths: ['release-version.txt']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.2.0'

permissions:
  contents: write

concurrency:
  group: logmimic-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require LogMimic source package
        shell: pwsh
        run: |
          if (!(Test-Path 'LogMimic_SourceKit.zip')) {
            throw 'Missing LogMimic_SourceKit.zip. Upload this file to the repository root before running this workflow.'
          }
          Expand-Archive LogMimic_SourceKit.zip -DestinationPath . -Force

      - name: Checkout Oracle 1.3.4 and MirageUI
        uses: actions/checkout@v4
        with:
          repository: exatrines/Oracle
          ref: v1.3.4
          path: upstream
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Normalize Oracle patch anchor
        shell: pwsh
        run: python tools/fix_oracle_anchor.py

      - name: Prepare source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Get-Content release-version.txt -Raw).Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be X.Y.Z' }
          $env:BUILD_VERSION = "$version.0"
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "BUILD_VERSION=$env:BUILD_VERSION" >> $env:GITHUB_ENV
          "BUILD_TAG=logmimic-v$version" >> $env:GITHUB_ENV
          python prepare_standalone.py upstream --repository $env:GITHUB_REPOSITORY --version $env:BUILD_VERSION

      - name: Apply LogMimic interface and localization
        shell: pwsh
        run: python plugins/LogMimic/ui/apply_ui.py upstream

      - name: Verify Auto Load selection and migration
        shell: pwsh
        run: dotnet run --project plugins/LogMimic/ui/tests/AutoLoadChecks.csproj --configuration Release

      - name: Verify countdown replay and preparation timing
        shell: pwsh
        run: dotnet run --project plugins/LogMimic/ui/tests-start/ReplayStartChecks.csproj --configuration Release

      - name: Download Dalamud assemblies
        shell: pwsh
        run: |
          $dev = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dev | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $dev -Force

      - name: Build LogMimic
        shell: pwsh
        run: |
          dotnet restore upstream/Oracle/Oracle.csproj
          dotnet build upstream/Oracle/Oracle.csproj --no-restore --configuration Release -p:Platform=x64 -p:AssemblyVersion=$env:BUILD_VERSION -p:FileVersion=$env:BUILD_VERSION

      - name: Package build
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem upstream/Oracle/bin/Release -Recurse -Filter LogMimic.json | Where-Object { Test-Path (Join-Path $_.DirectoryName 'LogMimic.dll') })
          if ($manifests.Count -ne 1) { throw "Expected one plugin output directory, found $($manifests.Count)" }
          python create_release_files.py $manifests[0].DirectoryName --repository $env:GITHUB_REPOSITORY --version $env:BUILD_VERSION --tag $env:BUILD_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Plugin packaging failed' }

      - name: Include upstream license and attribution in plugin archive
        shell: pwsh
        run: |
          @'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile("dist/latest.zip", "a", compression=ZIP_DEFLATED) as archive:
              archive.write("LICENSE", "LICENSE")
              archive.write("NOTICE.md", "NOTICE.md")
          '@ | python -

      - name: Archive corresponding patched source
        shell: pwsh
        run: |
          git -C upstream submodule status --recursive | Set-Content upstream/UPSTREAM-SUBMODULES.txt
          git -C upstream rev-parse HEAD | Set-Content upstream/UPSTREAM-COMMIT.txt
          tar --exclude=.git --exclude=bin --exclude=obj -czf dist/LogMimic-source.tar.gz -C upstream .
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }

      - name: Publish release (only after a successful build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: LogMimic ${{ env.RELEASE_VERSION }}
          body: 'Experimental build. In-game operation and Korean/global client compatibility have not been verified. Install only with a matching Dalamud API level.'
          files: |
            dist/latest.zip
            dist/LogMimic-source.tar.gz
          fail_on_unmatched_files: true

      - name: Update Dalamud plugin list
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "publish: LogMimic $env:BUILD_VERSION"
            git push origin HEAD:main
          }
