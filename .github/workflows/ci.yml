name: LogMimic build check

on:
  push:
    branches: [main]
    paths:
      - 'LogMimic_SourceKit.zip'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract experimental source patch
        shell: pwsh
        run: |
          if (!(Test-Path 'LogMimic_SourceKit.zip')) { throw 'Missing source archive' }
          Expand-Archive LogMimic_SourceKit.zip -DestinationPath . -Force
      - name: Checkout Oracle and MirageUI
        uses: actions/checkout@v4
        with:
          repository: exatrines/Oracle
          ref: v1.3.4
          path: upstream
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply LogMimic source patch
        shell: pwsh
        run: python prepare_standalone.py upstream --repository Beneficial-Pea/dalamudplugins --version 0.1.0.0
      - name: Fetch Dalamud development libraries
        shell: pwsh
        run: |
          $dev = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dev | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $dev -Force
      - name: Compile plugin
        shell: pwsh
        run: |
          dotnet restore upstream/Oracle/Oracle.csproj
          dotnet build upstream/Oracle/Oracle.csproj --no-restore -c Release -p:Platform=x64
      - name: Upload DLL for review (not a public release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LogMimic-unverified-build
          path: |
            upstream/Oracle/bin/Release/*.dll
            upstream/Oracle/bin/Release/*.json
          if-no-files-found: error
